[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="lottery-human-selection-crowding-lab"
version="0.1.0"
description="Explainable human-selection crowding features for lottery combinations."
readme="README.md"
requires-python=">=3.10"
dependencies=["numpy>=1.26,<3"]

[project.optional-dependencies]
dev=["pytest>=8,<9"]

[project.scripts]
crowding="lottery_human_selection_crowding.cli:main"

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]

[tool.setuptools.packages.find]
where=["src"]
